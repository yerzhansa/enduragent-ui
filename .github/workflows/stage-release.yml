name: Stage Release
on:
  workflow_dispatch:
    inputs:
      prepare_run_id:
        description: Successful Prepare Release run for this main snapshot
        required: true
        type: string
      artifact_sha512:
        description: Reviewed ui.tgz SHA-512 from the preparation artifact
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: stage-release
  cancel-in-progress: false
jobs:
  stage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: npm-stage
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - run: npm install --global npm@11.19.1 --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ui-release
          path: release
          run-id: ${{ inputs.prepare_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: echo "RELEASE_DATE=$(date -u +%F)" >> "$GITHUB_ENV"
      - run: node tools/verify-release.mjs stage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
          ARTIFACT_SHA512: ${{ inputs.artifact_sha512 }}
      - run: npm stage publish ./release/ui.tgz --access public --tag latest --ignore-scripts --provenance --registry=https://registry.npmjs.org
