name: Prepare Release
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: prepare-release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: echo "RELEASE_DATE=$(date -u +%F)" >> "$GITHUB_ENV"
      - run: node tools/verify-release.mjs prepare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node --test tests/calver.test.mjs tests/verify-release.test.mjs
      - run: pnpm check
      - run: pnpm build
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check:packed
      - name: Preserve reviewed package bytes
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, copyFileSync, readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { dirname, basename, resolve } from 'node:path';
          const proof = JSON.parse(readFileSync('artifacts/packed-artifact.json', 'utf8'));
          if (typeof proof.tarball !== 'string' || dirname(resolve(proof.tarball)) !== resolve('artifacts') || !/^enduragent-ui-[\w.-]+\.tgz$/.test(basename(proof.tarball))) throw new Error('Invalid proven tarball path');
          mkdirSync('release');
          copyFileSync(proof.tarball, 'release/ui.tgz');
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          const sha512 = createHash('sha512').update(readFileSync('release/ui.tgz')).digest('hex');
          if (sha512 !== proof.sha512) throw new Error('Packed proof digest mismatch');
          writeFileSync('release/identity.json', JSON.stringify({ repository: 'yerzhansa/enduragent-ui', commit: process.env.GITHUB_SHA, version: manifest.version, sha512 }, null, 2));
          process.stdout.write(sha512);
          NODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ui-release
          path: release/
          if-no-files-found: error
          retention-days: 14
